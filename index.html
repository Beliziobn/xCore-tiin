    <!-- Recuperação Precoce de ChunkLoadError / Entry Script 404 (antes do bundle principal carregar) -->
    <script data-cfasync="false">
      (function () {
        var GUARD_KEY = 'sigre_chunk_reload_guard_ts';
        var COOLDOWN_MS = 20000;
        function recoverFromStaleChunk(reason) {
          try {
            var now = Date.now();
            var last = Number(sessionStorage.getItem(GUARD_KEY) || '0');
            if (last > 0 && now - last < COOLDOWN_MS) return;
            sessionStorage.setItem(GUARD_KEY, String(now));
          } catch (e) {}
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window && window.caches && window.caches.keys) {
              window.caches.keys().then(function (keys) {
                for (var j = 0; j < keys.length; j++) window.caches.delete(keys[j]);
              });
            }
          } catch (e) {}
          setTimeout(function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set('_v', String(Date.now()));
              window.location.replace(u.toString());
            } catch (e) {
              window.location.reload();
            }
          }, 80);
        }
        window.addEventListener(
          'error',
          function (ev) {
            var t = ev && ev.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              var url = t.src || t.href || '';
              if (url.indexOf('/assets/') !== -1 || url.indexOf('/src/main.tsx') !== -1) {
                recoverFromStaleChunk('Early asset 404: ' + url);
              }
            }
          },
          true
        );
      })();
    </script>
